name: PiPaCraft HUD bauen
on:
  push:
    paths:
      - 'PiPaCraftHUD/**'
      - '.github/workflows/pipacrafthud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '5.6.4'
      - name: Forge-Mod bauen und Tests ausführen
        working-directory: PiPaCraftHUD
        run: gradle --no-daemon --stacktrace build
      - name: Release-JAR prüfen
        run: |
          python3 - <<'PY'
          import json, struct, zipfile
          from pathlib import Path
          jar = Path('PiPaCraftHUD/build/libs/PiPaCraftHUD-1.0.2.jar')
          with zipfile.ZipFile(jar) as z:
              info = json.loads(z.read('mcmod.info'))[0]
              assert info['modid'] == 'pipacrafthud'
              assert info['version'] == '1.0.2' and info['mcversion'] == '1.12.2'
              assert info['serverSideOnly']
              classes = [n for n in z.namelist() if n.endswith('.class')]
              assert 'de/skyz/pipacrafthud/PiPaCraftHUD.class' in classes
              assert not any(n.endswith('Test.class') for n in classes)
              for name in classes:
                  data = z.read(name)
                  assert struct.unpack('>H', data[6:8])[0] == 52, name
                  assert b'net/minecraft/client/' not in data, name
              command = z.read('de/skyz/pipacrafthud/PiPaCraftHUD$LiveCommand.class')
              assert b'func_82362_a' in command and b'func_184882_a' in command
              kills = z.read('de/skyz/pipacrafthud/PiPaCraftHUD$KillsCommand.class')
              assert b'func_82362_a' in kills and b'func_184882_a' in kills
              assert b'RUN_COMMAND' in kills and b'/pipakills' in kills
              assert 'de/skyz/pipacrafthud/DeathLeaderboard.class' in classes
          print('Java 8, Server-Metadaten und SRG-Befehle geprüft.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PiPaCraftHUD-1.0.2
          path: |
            PiPaCraftHUD/build/libs/PiPaCraftHUD-1.0.2.jar
            PiPaCraftHUD/README-DE.md
            PiPaCraftHUD/pipacrafthud.example.json
          if-no-files-found: error
          retention-days: 30
